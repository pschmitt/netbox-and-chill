name: Play Store (manual, disabled by default)

# This workflow is intentionally manual. It always produces a signed AAB artifact for inspection;
# the publishing job additionally requires the explicit `publish` input and the repository
# variable PLAY_PUBLISH_ENABLED=true. No Play Console account or service-account secret is needed
# until that gate is deliberately enabled.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Monotonically increasing Google Play version code"
        required: true
        default: "1"
        type: string
      version_name:
        description: "User-visible release version"
        required: true
        default: "1.0.0"
        type: string
      publish:
        description: "Upload the bundle to the Play internal-testing track"
        required: true
        default: false
        type: boolean

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Validate and build signed AAB
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] || {
            echo "version_name contains unsupported characters" >&2
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode CI signing keystore
        id: ci_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'netboxandchill-ci.jks'
          encodedString: ${{ secrets.CI_KEYSTORE_BASE64 }}

      - name: Compute build metadata
        id: metadata
        run: |
          echo "revision=$(git describe --always --abbrev=12 --dirty)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed Android App Bundle
        run: >
          ./gradlew bundleRelease
          "-PversionCode=$RELEASE_VERSION_CODE"
          "-PversionName=$RELEASE_VERSION_NAME"
          --stacktrace --build-cache
        env:
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          CI_KEYSTORE_PATH: ${{ steps.ci_keystore.outputs.filePath }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
          GIT_REVISION: ${{ steps.metadata.outputs.revision }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}

      - name: Verify bundle output
        run: |
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle" || {
            echo "Expected signed bundle was not produced: $bundle" >&2
            exit 1
          }

      - name: Upload Play artifact
        uses: actions/upload-artifact@v7
        with:
          name: nyetbox-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-gate:
    name: Reject accidental publishing
    needs: bundle
    if: ${{ inputs.publish == true && vars.PLAY_PUBLISH_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the repository-level publication gate
        run: |
          echo "Publishing was requested, but PLAY_PUBLISH_ENABLED is not true." >&2
          echo "Set that repository variable only after Play Console and service-account setup." >&2
          exit 1

  publish:
    name: Upload to Play internal testing
    needs: bundle
    if: ${{ inputs.publish == true && vars.PLAY_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download Play artifact
        uses: actions/download-artifact@v7
        with:
          name: nyetbox-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: play-artifact

      - name: Check publication credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "PLAY_SERVICE_ACCOUNT_JSON is required when publishing is enabled." >&2
            exit 1
          }

      - name: Upload bundle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.pschmitt.nyetbox
          releaseFiles: play-artifact/app-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true
