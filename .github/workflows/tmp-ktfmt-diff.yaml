name: Temp ktfmt diff

on:
  workflow_dispatch:

jobs:
  diff:
    name: ktfmtFormat diff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.11'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Format with ktfmt
        run: ./gradlew ktfmtFormat
      - name: Produce diff patch
        run: git diff > /tmp/ktfmt.patch
      - name: Upload diff patch
        uses: actions/upload-artifact@v7
        with:
          name: ktfmt-diff-patch
          path: /tmp/ktfmt.patch
          if-no-files-found: error
