name: Lint

# Dispatchable on demand (e.g. to preemptively check formatting before pushing) in addition to
# its normal push/PR gating. The ktfmt and Android Lint checks run as independent parallel jobs
# so a failure in one doesn't hide or block the other - both report in a single run instead of
# needing a fix-push-fail-fix-push cycle per issue. When ktfmtCheck fails - on any trigger - the
# `ktfmt` job uploads a `ktfmt-diff-patch` artifact containing exactly what `./gradlew ktfmtFormat`
# would change (see AGENTS.md's "Builds" section for why that beats trying to reproduce ktfmt's
# verdict locally), and additionally tries to land that same fix automatically: pushed straight
# onto a same-repo PR's branch (pre-merge, safe to amend in place), or opened as a new PR when the
# failure came from a direct push to main with no PR to push into. A fork PR can't be pushed to by
# GITHUB_TOKEN at all, so that case only gets the patch artifact.
on:
  push:
    # Scoped to main only - a push to any other branch that already has an open PR also fires
    # `pull_request: synchronize` for the exact same commit, and without this filter both trigger
    # a run: the `pull_request` one correctly pushes the fix onto the PR branch, but the `push` one
    # (event_name != 'pull_request') would *also* run and open a redundant, confusingly-separate
    # fix PR for a branch that already has one. Confirmed live: this happened on the first real
    # test of this workflow.
    branches:
      - main
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
      - 'app/lint-baseline.xml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '.github/workflows/lint.yaml'
      - 'app/lint-baseline.xml'
  workflow_dispatch:

jobs:
  ktfmt:
    name: ktfmt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # For a PR, check out the actual head branch rather than the ephemeral merge ref, so a
          # formatting fix (below) can be pushed straight back onto it.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.11'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check with ktfmt
        id: ktfmt_check
        run: ./gradlew ktfmtCheck
      - name: Produce ktfmt diff patch
        if: ${{ failure() && steps.ktfmt_check.outcome == 'failure' }}
        run: |
          ./gradlew ktfmtFormat
          git diff > /tmp/ktfmt.patch
      - name: Upload ktfmt diff patch
        if: ${{ failure() && steps.ktfmt_check.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ktfmt-diff-patch
          path: /tmp/ktfmt.patch
          if-no-files-found: error
      - name: Commit formatting fix onto this PR's branch
        # Only for a same-repo PR - GITHUB_TOKEN can't push to a fork's branch at all, so that case
        # falls back to the uploaded patch artifact above. This push won't retrigger this workflow
        # (GITHUB_TOKEN-authored pushes don't start new runs), so it isn't independently
        # reverified by CI - the fix is mechanical reformatting only, and a reviewer/re-run can
        # always confirm.
        if: >-
          ${{ failure() && steps.ktfmt_check.outcome == 'failure' &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.kt' '*.kts'
          git commit -m "style: apply ktfmt formatting"
          git push origin "HEAD:$HEAD_REF"
      - name: Open a PR with the formatting fix
        # No existing PR to push into for a direct push (e.g. to main) - open a new one instead of
        # amending the pushed branch directly.
        if: ${{ failure() && steps.ktfmt_check.outcome == 'failure' && github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: apply ktfmt formatting"
          title: "style: apply ktfmt formatting"
          body: >-
            Automated ktfmt formatting fix - `ktfmtCheck` failed on
            ${{ github.sha }} (`${{ github.ref_name }}`).
          branch: ci/ktfmt-format-fix
          add-paths: |
            **.kt
            **.kts

  android-lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21.0.11'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Android Lint
        run: ./gradlew lintDebug
      - name: Reject unreviewed lint-baseline changes
        if: ${{ !cancelled() }}
        run: |
          ./gradlew updateLintBaselineDebug
          # AGP records absolute paths for the version catalog. Keep the reviewed baseline
          # portable between the remote build hosts and the GitHub Actions checkout.
          sed -E -i 's#file="[^"]*/gradle/libs\.versions\.toml"#file="gradle/libs.versions.toml"#g' app/lint-baseline.xml
          git diff --exit-code -- app/lint-baseline.xml
      - name: Upload Android Lint report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
